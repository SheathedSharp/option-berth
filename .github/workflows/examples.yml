name: Checked-in examples
on:
  # No path filter on pull_request: a skipped required workflow leaves its
  # check pending and blocks the PR.
  pull_request:
  push:
    branches: [main]
    paths:
      - 'examples/**'
      - 'engine/**'
      - 'scripts/verify-example.py'
      - '.github/workflows/examples.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: examples-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: Examples / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - name: Verify the checked-in examples in two worktrees
        shell: bash
        run: |
          set -euo pipefail
          output=$(mktemp -d)
          trap 'rm -rf "$output"' EXIT
          (cd engine && go build -o "$output/oberth" ./cmd/oberth)
          python3 scripts/verify-example.py --binary "$output/oberth"
