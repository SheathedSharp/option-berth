name: Unified console interaction
on:
  pull_request:
    paths: ['client/macos/**', '.github/workflows/console.yml']
  push:
    branches: [main]
    paths: ['client/macos/**', '.github/workflows/console.yml']
permissions:
  contents: read
concurrency:
  group: unified-console-${{ github.ref }}
  cancel-in-progress: true
jobs:
  console:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Build native console checks
        run: swift build --package-path client/macos --force-resolved-versions --product ConsoleChecks
      - name: Verify mixed PTY identity, actual key input and focus lifecycle
        run: |
          set -euo pipefail
          binary_dir=$(swift build --package-path client/macos --show-bin-path)
          isolation=$(mktemp -d "$RUNNER_TEMP/console-checks.XXXXXX")
          mkdir -p "$isolation/home/.option-berth" "$RUNNER_TEMP/console-evidence"
          trap 'cp "$isolation/home/.option-berth/"*-native.png "$RUNNER_TEMP/console-evidence/" 2>/dev/null || true; rm -rf "$isolation"' EXIT
          HOME="$isolation/home" CFFIXED_USER_HOME="$isolation/home" BERTH_HOME="$isolation/home/.option-berth" SHELL=/bin/zsh ZDOTDIR="$isolation/home" BERTH_CONSOLE_TEST=1 "$binary_dir/ConsoleChecks" | tee "$RUNNER_TEMP/console-evidence/checks.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: console-native-${{ github.run_id }}
          path: ${{ runner.temp }}/console-evidence
          retention-days: 7
          if-no-files-found: error
