name: Engine verification

on:
  # Move the release gate in front of the merge: every PR runs the native
  # build, vet, unit tests and the fast helper suites on both supported engine
  # platforms. Core race tests and real service scenarios stay on manual
  # dispatch and on the tag-driven release workflow.
  # Called by ci.yml, which owns the pull request trigger and the path
  # routing. A manual dispatch still runs this check on its own.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    env:
      GOMAXPROCS: '4'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Record the exact verification input
        shell: bash
        run: |
          # TestMain owns each test binary's state directory; do not share one
          # BERTH_HOME across packages or the unit/race/scenario steps.
          mkdir -p verification
          git rev-parse HEAD > verification/commit.txt
          git rev-parse 'HEAD^{tree}' > verification/tree.txt
      # The skill is a separate repository, but it teaches this contract. The
      # required check reads a literal commit, so an unrelated push to the skill
      # repository cannot turn this pull request red. Moving the pin is a change
      # to this workflow, which Gate integrity already limits to a maintainer.
      - name: Check out the agent skill at the pinned commit
        if: runner.os == 'Linux'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: SheathedSharp/option-berth-skill
          ref: 35f579dbd784995da74ba7034dcd50295fe7be35
          path: option-berth-skill
          persist-credentials: false
      - name: Skill covers the agent contract
        if: runner.os == 'Linux'
        shell: bash
        run: python3 scripts/check_skill_contract.py --skill-dir option-berth-skill
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - name: Native build
        working-directory: engine
        run: go build ./...
      - name: Cross-build release targets
        if: runner.os == 'Linux'
        working-directory: engine
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build ./...
          done
      - name: Vet
        working-directory: engine
        shell: bash
        run: |
          set -o pipefail
          go version | tee ../verification/go-version.txt
          go vet ./... 2>&1 | tee ../verification/vet.log
      - name: Full engine tests
        if: success() || failure()
        working-directory: engine
        shell: bash
        run: |
          set -o pipefail
          go test -count=1 -timeout=8m ./... 2>&1 | tee ../verification/unit.log
      - name: Core concurrency tests
        if: github.event_name == 'workflow_dispatch' && (success() || failure())
        working-directory: engine
        shell: bash
        run: |
          set -o pipefail
          # macOS ships bash 3.2, which has no mapfile.
          race_packages=()
          while IFS= read -r package; do
            race_packages+=("$package")
          done < <(grep -vE '^[[:space:]]*(#|$)' ../scripts/race-packages.txt)
          go test -race -count=1 -timeout=10m "${race_packages[@]}" 2>&1 | tee ../verification/race.log
      - name: Real service scenarios
        if: github.event_name == 'workflow_dispatch' && (success() || failure())
        working-directory: engine
        shell: bash
        run: |
          set -o pipefail
          go test -tags integration -v -count=1 -timeout=8m ./internal/scenario/... 2>&1 | tee ../verification/scenario.log
      - name: Mage workflow regression tests
        shell: bash
        run: go test -race -count=1 magefiles/build.go magefiles/workflow.go magefiles/workflow_test.go
      - name: Install package tools for tests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Only the network fetch is retried: a mirror hiccup is not a result
          # about this change. Never wrap a test, vet or verification step —
          # a retry there would mask a real failure behind a slower red build.
          source scripts/retry.sh
          retry 4 5 -- sudo apt-get update
          retry 4 5 -- sudo apt-get install -y rpm
          retry 4 5 -- go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.46.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Measurement helper tests
        shell: bash
        run: python3 -m unittest discover -s scripts -p '*_test.py'
      - name: Retain verification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: engine-verification-${{ matrix.os }}-${{ github.run_id }}
          path: verification/
          retention-days: 7

  skill-drift:
    # Advisory, never required: this job reports how far the pinned skill commit
    # lags `main`, so adopting a skill release is a visible decision instead of a
    # surprise red pull request. Keep it out of .github/quality-gate-checks.json
    # and the `main` ruleset.
    name: Skill contract / drift from main
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check out the agent skill at main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: SheathedSharp/option-berth-skill
          ref: main
          path: option-berth-skill
          persist-credentials: false
      - name: Record the pinned and the moving commit
        shell: bash
        run: |
          set -euo pipefail
          # Keep in sync with the literal ref in the required checkout above.
          pin=35f579dbd784995da74ba7034dcd50295fe7be35
          head=$(git -C option-berth-skill rev-parse HEAD)
          echo "pinned: $pin"
          echo "main:   $head"
          if [ "$pin" = "$head" ]; then
            echo "skill main is the pinned commit"
          else
            echo "skill main has moved past the pin; the required check still uses the pinned commit"
          fi
      - name: Skill main covers the agent contract
        id: drift
        # Advisory: the step reports failure but the job stays green.
        continue-on-error: true
        shell: bash
        run: python3 scripts/check_skill_contract.py --skill-dir option-berth-skill
      - name: Publish drift as an annotation
        if: steps.drift.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning title=Skill contract drift::option-berth-skill main no longer covers the engine's agent contract; review the skill change and move the pinned ref in .github/workflows/engine.yml when it is ready"

  windows-install-scripts:
    name: windows-install-scripts
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Parse install and uninstall scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          # Both scripts declare #Requires -Version 5.1. Parsing them with
          # Windows PowerShell rejects syntax that would break the documented
          # minimum; pwsh 7 alone would accept PS7-only syntax.
          foreach ($script in 'install.ps1', 'uninstall.ps1') {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count) {
              $errors | ForEach-Object { Write-Error $_ }
              exit 1
            }
          }
