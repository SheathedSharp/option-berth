name: Engine verification

on:
  # Move the release gate in front of the merge: every PR runs the native
  # build, vet, unit tests and the fast helper suites on both supported engine
  # platforms. Core race tests and real service scenarios stay on manual
  # dispatch and on the tag-driven release workflow.
  # No path filter here: a skipped path-filtered workflow leaves a required
  # check pending and blocks the PR.
  pull_request:
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - 'magefiles/**'
      - 'scripts/**'
      - 'install.sh'
      - 'install.ps1'
      - 'uninstall.sh'
      - 'uninstall.ps1'
      - '.github/workflows/engine.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Engine / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    env:
      GOMAXPROCS: '4'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Record the exact verification input
        shell: bash
        run: |
          # TestMain owns each test binary's state directory; do not share one
          # BERTH_HOME across packages or the unit/race/scenario steps.
          mkdir -p verification
          git rev-parse HEAD > verification/commit.txt
          git rev-parse HEAD^{tree} > verification/tree.txt
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - name: Native build
        working-directory: engine
        run: go build ./...
      - name: Cross-build release targets
        if: runner.os == 'Linux'
        working-directory: engine
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build ./...
          done
      - name: Vet
        working-directory: engine
        shell: bash
        run: |
          set -o pipefail
          go version | tee ../verification/go-version.txt
          go vet ./... 2>&1 | tee ../verification/vet.log
      - name: Full engine tests
        if: success() || failure()
        working-directory: engine
        shell: bash
        run: |
          set -o pipefail
          go test -count=1 -timeout=8m ./... 2>&1 | tee ../verification/unit.log
      - name: Core concurrency tests
        if: github.event_name == 'workflow_dispatch' && (success() || failure())
        working-directory: engine
        shell: bash
        run: |
          set -o pipefail
          # macOS ships bash 3.2, which has no mapfile.
          race_packages=()
          while IFS= read -r package; do
            race_packages+=("$package")
          done < <(grep -vE '^[[:space:]]*(#|$)' ../scripts/race-packages.txt)
          go test -race -count=1 -timeout=10m "${race_packages[@]}" 2>&1 | tee ../verification/race.log
      - name: Real service scenarios
        if: github.event_name == 'workflow_dispatch' && (success() || failure())
        working-directory: engine
        shell: bash
        run: |
          set -o pipefail
          go test -tags integration -count=1 -timeout=8m ./internal/scenario/... 2>&1 | tee ../verification/scenario.log
      - name: Mage workflow regression tests
        shell: bash
        run: go test -race -count=1 magefiles/build.go magefiles/workflow.go magefiles/workflow_test.go
      - name: Install package tools for tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.46.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Measurement helper tests
        shell: bash
        run: python3 -m unittest discover -s scripts -p '*_test.py'
      - name: Retain verification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: engine-verification-${{ matrix.os }}-${{ github.run_id }}
          path: verification/
          retention-days: 7

  windows-install-scripts:
    name: Engine / windows-install-scripts
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Parse install and uninstall scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          # Both scripts declare #Requires -Version 5.1. Parsing them with
          # Windows PowerShell rejects syntax that would break the documented
          # minimum; pwsh 7 alone would accept PS7-only syntax.
          foreach ($script in 'install.ps1', 'uninstall.ps1') {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count) {
              $errors | ForEach-Object { Write-Error $_ }
              exit 1
            }
          }
