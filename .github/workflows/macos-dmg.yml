name: macOS DMG distribution
on:
  pull_request:
    paths: ['scripts/*release*.py', 'client/macos/**', '.github/workflows/macos-dmg.yml']
  push:
    branches: [main]
    paths: ['scripts/*release*.py', 'client/macos/**', '.github/workflows/macos-dmg.yml']
permissions:
  contents: read
concurrency:
  group: macos-dmg-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - name: Verify packaging failure boundaries
        run: python3 -m unittest discover -s scripts -p '*release*_test.py'
      - name: Build app without installation
        run: bash client/macos/build.sh
      - name: Package, mount read-only and verify an isolated installation copy
        run: |
          set -euo pipefail
          python3 scripts/package_release.py --os darwin --arch arm64 --include-app --output "$RUNNER_TEMP/dmg-dist"
          version=$(cat VERSION)
          image="OptionBerth-v${version}-macos-arm64-adhoc.dmg"
          test -s "$RUNNER_TEMP/dmg-dist/$image"
          test ! -e "$RUNNER_TEMP/dmg-dist/${image%.dmg}.zip"
          cd "$RUNNER_TEMP/dmg-dist"
          shasum -a 256 -c "$image.sha256"
          # This workflow deliberately does not upload an installable binary or
          # publish a release. Native verification runs inside package_release.
