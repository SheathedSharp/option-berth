name: Agent eval / real agent matrix

# This workflow spends real model tokens. It is manual-only. `plan` is cheap and
# ungated so the cost estimate is on the run page before anyone approves; the
# `matrix` job is behind the `agent-eval` environment and cannot call a model
# until a reviewer approves it. Do not add pull_request, push or schedule
# triggers.
#
# The matrix is sharded by the cost unit, not by agent: `plan` divides each
# provider's scenarios into groups sized to a wall-clock target, and `merge`
# unions the shards. A shard that is cancelled still uploads its journal and a
# partial report; the next dispatch can resume it instead of paying twice.
on:
  workflow_dispatch:
    inputs:
      agents:
        description: Comma list of agents (claude,codex,opencode,pi)
        required: true
        default: claude,codex,opencode,pi
        type: string
      suite:
        description: Scenario suite (core, large, cold, all)
        required: true
        default: large
        type: string
      scenarios:
        description: Comma list of scenario ids, or all
        required: true
        default: all
        type: string
      arms:
        description: Arms to run (oberth,oberth-noskill,native). native is the no-product control.
        required: true
        default: oberth,native
        type: string
      repeat:
        description: Runs per scenario/agent/arm (>=2 makes rows comparable, >=5 adds intervals; p95 needs >=20)
        required: true
        default: '2'
        type: string
      options:
        description: >-
          JSON tuning object; unknown keys are rejected. Keys and defaults:
          compare (oberth,native), shard_minutes (60), per_run_seconds (240),
          budget_minutes (240), max_parallel (4), shard_timeout_minutes (120),
          run_timeout (600), max_consecutive_failures (3), resume_run ("").
        required: false
        default: '{}'
        type: string
      claude_model:
        description: Model for Claude Code through the Anthropic protocol
        required: true
        default: qwen-3.8-flash
        type: string
      codex_model:
        description: Model for Codex through the Responses API
        required: true
        default: gpt-6-luna
        type: string
      opencode_model:
        description: Model for OpenCode through the OpenAI chat protocol
        required: true
        default: step-5-preview
        type: string
      pi_model:
        description: Model for Pi through the OpenAI chat protocol
        required: true
        default: space-bunny
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  # A new dispatch supersedes a stale experiment instead of queueing behind it.
  # A cancelled matrix job still runs its `if: always()` steps, so the journal
  # and partial report survive the cancellation.
  group: agent-eval
  cancel-in-progress: true

env:
  AGENTS: ${{ inputs.agents }}
  SUITE: ${{ inputs.suite }}
  SCENARIOS: ${{ inputs.scenarios }}
  ARMS: ${{ inputs.arms }}
  REPEAT: ${{ inputs.repeat }}
  OPTIONS: ${{ inputs.options }}
  CLAUDE_MODEL: ${{ inputs.claude_model }}
  CODEX_MODEL: ${{ inputs.codex_model }}
  OPENCODE_MODEL: ${{ inputs.opencode_model }}
  PI_MODEL: ${{ inputs.pi_model }}

jobs:
  plan:
    name: Agent eval / plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Deliberately not behind the environment: this job builds and preflights
    # but never calls a model, so it can run before the approval and publish the
    # cost estimate the approver needs. Only `matrix` is gated.
    outputs:
      options: ${{ steps.options.outputs.options }}
      shards: ${{ steps.matrix.outputs.shards }}
      agents: ${{ steps.matrix.outputs.agents }}
      expected_scenarios: ${{ steps.matrix.outputs.expected_scenarios }}
      total_runs: ${{ steps.matrix.outputs.total_runs }}
      estimated_minutes: ${{ steps.matrix.outputs.estimated_minutes }}
      skill_sha: ${{ steps.matrix.outputs.skill_sha }}
    steps:
      - name: Validate the tuning options
        id: options
        shell: bash
        run: |
          set -euo pipefail
          # One JSON object instead of eight more dispatch inputs (GitHub caps
          # workflow_dispatch at ten). Unknown keys are rejected so a typo does
          # not silently run with a default the operator did not intend.
          python3 - "$OPTIONS" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys

          defaults = {
              "compare": "oberth,native",
              "shard_minutes": 60,
              "per_run_seconds": 240,
              "budget_minutes": 240,
              "max_parallel": 4,
              "shard_timeout_minutes": 120,
              "run_timeout": 600,
              "max_consecutive_failures": 3,
              "resume_run": "",
          }
          raw = (sys.argv[1] or "").strip() or "{}"
          try:
              given = json.loads(raw)
          except json.JSONDecodeError as exc:
              raise SystemExit(f"options is not valid JSON: {exc}")
          if not isinstance(given, dict):
              raise SystemExit("options must be a JSON object")
          unknown = sorted(set(given) - set(defaults))
          if unknown:
              raise SystemExit("unknown option(s): " + ", ".join(unknown))
          merged = {**defaults, **given}
          for key in ("shard_minutes", "per_run_seconds", "run_timeout"):
              if not isinstance(merged[key], (int, float)) or merged[key] <= 0:
                  raise SystemExit(f"options.{key} must be a positive number")
          if not isinstance(merged["budget_minutes"], (int, float)) or merged["budget_minutes"] < 0:
              raise SystemExit("options.budget_minutes must be zero or a positive number")
          for key in ("shard_timeout_minutes", "max_parallel", "max_consecutive_failures"):
              if not isinstance(merged[key], int) or merged[key] < 0:
                  raise SystemExit(f"options.{key} must be a non-negative integer")
          if merged["max_parallel"] < 1:
              raise SystemExit("options.max_parallel must be at least 1")
          if merged["shard_timeout_minutes"] < 1:
              raise SystemExit("options.shard_timeout_minutes must be at least 1")
          if "," not in str(merged["compare"]):
              raise SystemExit("options.compare must be TREATED,CONTROL")
          with open(sys.argv[2], "a", encoding="utf-8") as handle:
              print("options=" + json.dumps(merged), file=handle)
              for key, value in merged.items():
                  print(f"{key}={value}", file=handle)
          PY
      - name: Check out the engine and the pinned skill
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          path: source
      - name: Check out option-berth-skill
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: SheathedSharp/option-berth-skill
          ref: main
          path: option-berth-skill
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: source/engine/go.mod
          cache-dependency-path: source/engine/go.sum
      - name: Build the engine under test
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/magefile/mage@v1.17.2
          "$(go env GOPATH)/bin/mage" buildEngine
          mkdir -p "$RUNNER_TEMP/agent-eval"
          bin/oberth version --json | tee "$RUNNER_TEMP/agent-eval/build.json"
      - name: Preflight listener observation
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/agent_eval.py --dry-run --scenarios missing-artifact \
            --binary bin/oberth --out "$RUNNER_TEMP/agent-eval/preflight"
      - name: Preflight the large-stack fixtures
        working-directory: source
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          # Provision every large fixture before any model is called. The
          # pre-start scenarios bring up ten to thirty real processes here, so
          # a broken service script fails this step instead of the matrix.
          python3 scripts/agent_eval.py --dry-run --suite large \
            --binary bin/oberth --out "$RUNNER_TEMP/agent-eval/preflight-large"
      - name: Provision the cold-start fixtures
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          # A cold-start fixture builds a git repository and nothing else, so
          # provisioning it is cheap; doing it here means a broken fixture fails
          # before any drafting run spends model quota.
          python3 scripts/agent_eval.py --dry-run --suite cold \
            --binary bin/oberth --out "$RUNNER_TEMP/agent-eval/preflight-cold"
      - name: Plan the shards and estimate the cost
        id: matrix
        working-directory: source
        shell: bash
        env:
          SHARD_MINUTES: ${{ steps.options.outputs.shard_minutes }}
          PER_RUN_SECONDS: ${{ steps.options.outputs.per_run_seconds }}
          MAX_PARALLEL: ${{ steps.options.outputs.max_parallel }}
          BUDGET_MINUTES: ${{ steps.options.outputs.budget_minutes }}
        run: |
          set -euo pipefail
          # The plan is the budget gate: it refuses an experiment whose wall
          # clock exceeds the dispatch's budget before any model is called.
          python3 scripts/agent_eval.py --plan \
            --agents "$AGENTS" --suite "$SUITE" --scenarios "$SCENARIOS" \
            --arms "$ARMS" --repeat "$REPEAT" \
            --shard-minutes "$SHARD_MINUTES" --per-run-seconds "$PER_RUN_SECONDS" \
            --max-parallel "$MAX_PARALLEL" --budget-minutes "$BUDGET_MINUTES" \
            > "$RUNNER_TEMP/agent-eval/plan.json"
          python3 - "$RUNNER_TEMP/agent-eval/plan.json" "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY" \
            "$GITHUB_WORKSPACE/option-berth-skill" <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          plan = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          output, summary = Path(sys.argv[2]), Path(sys.argv[3])
          skill_dir = sys.argv[4]
          shards = plan["shards"]
          agents = sorted({shard["agent"] for shard in shards})
          scenarios = sorted({
              scenario
              for shard in shards
              for scenario in shard["scenarios"].split(",")
          })
          skill_sha = subprocess.check_output(
              ["git", "-C", skill_dir, "rev-parse", "HEAD"], text=True
          ).strip()
          with output.open("a", encoding="utf-8") as handle:
              print("shards=" + json.dumps(shards), file=handle)
              print("agents=" + json.dumps(agents), file=handle)
              print("expected_scenarios=" + ",".join(scenarios), file=handle)
              print(f"total_runs={plan['total_runs']}", file=handle)
              print(f"estimated_minutes={plan['estimated_minutes']}", file=handle)
              print(f"skill_sha={skill_sha}", file=handle)
          lines = [
              "## Agent eval plan",
              "",
              f"- agents: {', '.join(agents)}",
              f"- scenarios: {len(scenarios)}",
              f"- requested runs: **{plan['total_runs']}**",
              f"- wall clock: **~{plan['estimated_minutes']} min** "
              f"({plan['total_run_minutes']} runner-min at {plan['max_parallel']} parallel shard(s))",
              f"- shard target: {plan['per_run_seconds']:g} s per run, "
              f"{len(shards)} shard(s)",
              f"- pinned skill: `{skill_sha[:12]}`",
              "",
              "| shard | agent | scenarios | runs | ~min |",
              "|---|---|---|---:|---:|",
          ]
          for shard in shards:
              lines.append(
                  f"| {shard['name']} | {shard['agent']} | {shard['scenarios']} "
                  f"| {shard['runs']} | {shard['estimated_minutes']} |"
              )
          with summary.open("a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY
      - name: Share the built binary with the shards
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: agent-eval-binary
          path: source/bin/oberth
          retention-days: 1
          if-no-files-found: error

  capacity:
    name: Agent eval / capacity
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: agent-eval
    steps:
      - name: Check out the engine
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          path: source
      - name: Probe the gateway at the planned concurrency
        working-directory: source
        shell: bash
        env:
          AGENT_GATEWAY_BASE_URL: ${{ secrets.LLM_GATEWAY_BASE_URL }}
          AGENT_GATEWAY_API_KEY: ${{ secrets.LLM_GATEWAY_API_KEY }}
          CLAUDE_MODEL: ${{ inputs.claude_model }}
          CODEX_MODEL: ${{ inputs.codex_model }}
          OPENCODE_MODEL: ${{ inputs.opencode_model }}
          PI_MODEL: ${{ inputs.pi_model }}
          MAX_PARALLEL: ${{ fromJSON(needs.plan.outputs.options).max_parallel }}
        run: |
          set -euo pipefail
          # The matrix assumes the provider can sustain max_parallel shards.
          # Probe that assumption with a few real requests per agent before a
          # shard spends a minute of model time: a model that is missing,
          # overloaded or rejects the second turn fails here, cheaply.
          for agent in ${AGENTS//,/ }; do
            case "$agent" in
              claude)   chat_model="$CLAUDE_MODEL" ;;
              codex)    chat_model="$CODEX_MODEL" ;;
              opencode) chat_model="$OPENCODE_MODEL" ;;
              pi)       chat_model="$PI_MODEL" ;;
              *) echo "unknown agent: $agent" >&2; exit 1 ;;
            esac
            python3 scripts/check_agent_gateway.py \
              --agents "$agent" \
              --claude-model "$CLAUDE_MODEL" \
              --codex-model "$CODEX_MODEL" \
              --chat-model "$chat_model" \
              --concurrency "$MAX_PARALLEL"
          done

  matrix:
    name: Agent eval / ${{ matrix.name }}
    needs: [plan, capacity]
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.options).shard_timeout_minutes }}
    environment: agent-eval
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.options).max_parallel }}
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      AGENT: ${{ matrix.agent }}
      SHARD_NAME: ${{ matrix.name }}
      SHARD_SCENARIOS: ${{ matrix.scenarios }}
      COMPARE: ${{ fromJSON(needs.plan.outputs.options).compare }}
      RUN_TIMEOUT: ${{ fromJSON(needs.plan.outputs.options).run_timeout }}
      MAX_CONSECUTIVE_FAILURES: ${{ fromJSON(needs.plan.outputs.options).max_consecutive_failures }}
      RESUME_RUN: ${{ fromJSON(needs.plan.outputs.options).resume_run }}
    steps:
      - name: Check out the engine and the pinned skill
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          path: source
      - name: Check out option-berth-skill
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: SheathedSharp/option-berth-skill
          ref: ${{ needs.plan.outputs.skill_sha }}
          path: option-berth-skill
          persist-credentials: false
      - name: Download the engine under test
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: agent-eval-binary
          path: source/bin
      - name: Restore the binary's execute bit
        shell: bash
        run: |
          set -euo pipefail
          # Artifacts do not preserve file modes; the harness invokes the
          # binary by path.
          chmod +x source/bin/oberth
          source/bin/oberth version --json
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v4
        with:
          node-version: '22.20.0'
      - name: Install this shard's agent
        shell: bash
        run: |
          set -euo pipefail
          # A fresh runner per shard: install only the provider this shard
          # exercises, not all four.
          mkdir -p "$RUNNER_TEMP/agent-eval"
          case "$AGENT" in
            claude)   package='@anthropic-ai/claude-code@2.1.314' ;;
            codex)    package='@openai/codex@0.166.0' ;;
            opencode) package='opencode-ai@1.19.5' ;;
            pi)       package='@earendil-works/pi-coding-agent@1.4.0' ;;
            *) echo "unknown agent: $AGENT" >&2; exit 1 ;;
          esac
          npm install -g --no-audit --no-fund "$package"
          printf '%s: ' "$AGENT"
          command -v "$AGENT"
          "$AGENT" --version 2>&1 | sed -n '1p'
          node --version
          { printf '%s: ' "$AGENT"; command -v "$AGENT"; "$AGENT" --version 2>&1 | sed -n '1p'; node --version; } \
            > "$RUNNER_TEMP/agent-eval/agent-versions.txt"
      - name: Align Codex tool exposure with the gateway contract
        if: matrix.agent == 'codex'
        shell: bash
        run: |
          set -euo pipefail
          config_dir="$RUNNER_TEMP/agent-eval"
          catalog="$config_dir/codex-models.json"
          mkdir -p "$config_dir/codex-home"
          # Codex's built-in metadata for GPT-6 models selects code-mode-only
          # and Responses Lite, which sends tools as additional_tools input
          # items instead of standard Responses function tools. Patch the
          # catalog for this run so Codex uses the same direct function tools
          # as the other agents; the gateway needs no Codex-specific branch.
          CODEX_HOME="$config_dir/codex-home" codex debug models > "$catalog"
          python3 - "$catalog" "$CODEX_MODEL" <<'PY'
          import json
          import sys

          path, model = sys.argv[1], sys.argv[2]
          with open(path, encoding="utf-8") as handle:
              catalog = json.load(handle)
          for entry in catalog.get("models", []):
              if entry.get("slug") == model:
                  entry["tool_mode"] = "direct"
                  entry["use_responses_lite"] = False
                  break
          else:
              raise SystemExit(f"model {model!r} is not in the Codex model catalog")
          with open(path, "w", encoding="utf-8") as handle:
              json.dump(catalog, handle)
          print(f"prepared {path} with direct tools for {model}")
          PY
      - name: Write provider configuration
        shell: bash
        env:
          GATEWAY_BASE_URL: ${{ secrets.LLM_GATEWAY_BASE_URL }}
          OPENCODE_MODEL_SELECTED: ${{ inputs.opencode_model }}
          PI_MODEL_SELECTED: ${{ inputs.pi_model }}
        run: |
          set -euo pipefail
          config_dir="$RUNNER_TEMP/agent-eval"
          mkdir -p "$config_dir/pi"
          python3 - "$config_dir" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          base = os.environ["GATEWAY_BASE_URL"].rstrip("/")
          if not base.endswith("/v1"):
              base += "/v1"
          opencode_model = os.environ["OPENCODE_MODEL_SELECTED"]
          pi_model = os.environ["PI_MODEL_SELECTED"]

          # The gateway key is interpolated by each agent at request time; the
          # key itself never appears in these files.
          opencode = {
              "$schema": "https://opencode.ai/config.json",
              "autoupdate": False,
              "snapshot": False,
              "model": f"gateway/{opencode_model}",
              "provider": {
                  "gateway": {
                      "npm": "@ai-sdk/openai-compatible",
                      "name": "LLM gateway",
                      "options": {
                          "baseURL": base,
                          "apiKey": "{env:GATEWAY_API_KEY}",
                      },
                      "models": {opencode_model: {"name": opencode_model}},
                  }
              },
          }
          pi = {
              "$schema": "https://pi.dev/schemas/models.schema.json",
              "providers": {
                  "gateway": {
                      "baseUrl": base,
                      "api": "openai-completions",
                      "apiKey": "$GATEWAY_API_KEY",
                      "models": [{"id": pi_model, "name": pi_model}],
                  }
              },
          }
          (root / "opencode.json").write_text(json.dumps(opencode, indent=2) + "\n")
          (root / "pi" / "models.json").write_text(json.dumps(pi, indent=2) + "\n")
          PY
          echo "wrote $config_dir/opencode.json and $config_dir/pi/models.json"
      - name: Run this agent's scenario shard
        working-directory: source
        shell: bash
        env:
          # Claude Code uses the Anthropic protocol. The fast model is pinned to
          # the same model so background calls never reach a different model.
          ANTHROPIC_BASE_URL: ${{ secrets.LLM_GATEWAY_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.LLM_GATEWAY_API_KEY }}
          ANTHROPIC_MODEL: ${{ inputs.claude_model }}
          ANTHROPIC_SMALL_FAST_MODEL: ${{ inputs.claude_model }}
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
          GATEWAY_BASE_URL: ${{ secrets.LLM_GATEWAY_BASE_URL }}
          # One key name for every agent that speaks an OpenAI protocol;
          # Claude uses ANTHROPIC_AUTH_TOKEN above.
          GATEWAY_API_KEY: ${{ secrets.LLM_GATEWAY_API_KEY }}
          OPENCODE_CONFIG: ${{ runner.temp }}/agent-eval/opencode.json
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/agent-eval/pi
          PI_OFFLINE: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          codex_base="${GATEWAY_BASE_URL%/}"
          if [[ "$codex_base" != */v1 ]]; then
            codex_base="$codex_base/v1"
          fi
          # The agent's real configuration, assembled once. The smoke run and
          # the matrix share this array on purpose: a preflight that built its
          # own flags would test a different setup from the one that runs.
          common=(
            --agents "$AGENT"
            --binary bin/oberth
            --skill-dir "$GITHUB_WORKSPACE/option-berth-skill"
            --timeout "$RUN_TIMEOUT"
            --max-consecutive-failures "$MAX_CONSECUTIVE_FAILURES"
            --pass-env ANTHROPIC_BASE_URL
            --pass-env ANTHROPIC_AUTH_TOKEN
            --pass-env ANTHROPIC_MODEL
            --pass-env ANTHROPIC_SMALL_FAST_MODEL
            --pass-env CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC
            --pass-env GATEWAY_API_KEY
            --pass-env OPENCODE_CONFIG
            --pass-env PI_CODING_AGENT_DIR
            --pass-env PI_OFFLINE
            --model "claude=$CLAUDE_MODEL"
            --model "codex=$CODEX_MODEL"
            --model "opencode=$OPENCODE_MODEL"
            --model "pi=$PI_MODEL"
            --agent-arg claude=--permission-mode=bypassPermissions
            --agent-arg codex=--sandbox
            --agent-arg codex=danger-full-access
            --agent-arg codex=-c
            --agent-arg 'codex=model_provider="gateway"'
            --agent-arg codex=-c
            --agent-arg 'codex=model_providers.gateway.name="gateway"'
            --agent-arg codex=-c
            --agent-arg "codex=model_providers.gateway.base_url=\"$codex_base\""
            --agent-arg codex=-c
            --agent-arg 'codex=model_providers.gateway.env_key="GATEWAY_API_KEY"'
            --agent-arg codex=-c
            --agent-arg 'codex=model_providers.gateway.wire_api="responses"'
            --agent-arg codex=-c
            --agent-arg 'codex=model_providers.gateway.supports_websockets=false'
            --agent-arg codex=-c
            --agent-arg "codex=model=\"$CODEX_MODEL\""
            --agent-arg codex=-c
            --agent-arg "codex=model_catalog_json=\"$RUNNER_TEMP/agent-eval/codex-models.json\""
            --agent-arg codex=-c
            --agent-arg 'codex=approval_policy="never"'
            --agent-arg opencode=--auto
            --agent-arg opencode=--model
            --agent-arg "opencode=gateway/$OPENCODE_MODEL"
            --agent-arg pi=--approve
            --agent-arg pi=--model
            --agent-arg "pi=gateway/$PI_MODEL"
          )
          # A smoke is one cheap real scenario through this exact configuration.
          # Every shard runs it: a shard is a fresh runner, and a provider that
          # rejects turn two must fail in a minute, not after the shard's runs.
          python3 scripts/agent_eval.py --smoke "${common[@]}" \
            --out "$RUNNER_TEMP/agent-eval/smoke"

          resume=()
          if [[ -n "$RESUME_RUN" ]]; then
            mkdir -p "$RUNNER_TEMP/resume"
            if gh run download "$RESUME_RUN" -n "agent-eval-shard-$SHARD_NAME" \
                -D "$RUNNER_TEMP/resume"; then
              journal=$(find "$RUNNER_TEMP/resume" -name journal.json -print -quit)
              if [[ -n "$journal" ]]; then
                resume=(--resume "$journal")
                echo "resuming from $journal" >&2
              fi
            else
              echo "no resumable artifact agent-eval-shard-$SHARD_NAME in run $RESUME_RUN" >&2
            fi
          fi

          python3 scripts/agent_eval.py "${common[@]}" \
            --execute \
            --suite "$SUITE" \
            --scenarios "$SHARD_SCENARIOS" \
            --arms "$ARMS" \
            --compare "$COMPARE" \
            --repeat "$REPEAT" \
            --out "$GITHUB_WORKSPACE/agent-eval-report" \
            --require-comparable \
            "${resume[@]}"
      - name: Rebuild a partial report and summarize this shard
        if: always()
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/agent-eval-report"
          if [[ ! -f "$out/report.json" && -f "$out/journal.json" ]]; then
            python3 scripts/agent_eval.py --report-only "$out" || true
          fi
          python3 - "$out" "$SHARD_NAME" "$AGENT" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys
          from pathlib import Path

          out, shard, agent = Path(sys.argv[1]), sys.argv[2], sys.argv[3]
          report_path = out / "report.json"
          if not report_path.is_file():
              print(f"## {shard}\n\nNo report.json and no journal: the shard never reached a run.\n")
              raise SystemExit(0)
          report = json.loads(report_path.read_text(encoding="utf-8"))
          runs = report.get("runs") or []
          ok = sum(1 for run in runs if run.get("status") == "ok")
          failed = sum(1 for run in runs if run.get("status") == "agent_error")
          harness = sum(1 for run in runs if run.get("status") == "harness_error")
          note = "" if not any("aborted" in note for note in report.get("notes") or []) else " (partial: circuit breaker fired)"
          print(f"## {shard}\n")
          print(f"- agent: `{agent}`")
          print(f"- runs recorded: **{len(runs)}**{note}")
          print(f"- ok: {ok}, not completed: {len(runs) - ok - failed - harness}, agent errors: {failed}, harness errors: {harness}")
          for row in report.get("summary") or []:
              print(
                  f"- {row['scenario']} / {row['arm']}: "
                  f"completion {row['completion_rate']}, steps median {row['steps_median']}, "
                  f"p95 {row['steps_p95']}"
                  + ("" if row.get("steps_p95_reliable") else " (p95 unreliable at this n)")
              )
          PY
      - name: Keep this shard
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: agent-eval-shard-${{ matrix.name }}
          path: |
            agent-eval-report/
            ${{ runner.temp }}/agent-eval/smoke/
            ${{ runner.temp }}/agent-eval/codex-models.json
            ${{ runner.temp }}/agent-eval/build.json
            ${{ runner.temp }}/agent-eval/agent-versions.txt
          if-no-files-found: warn
          retention-days: 30

  merge:
    name: Agent eval / merge
    needs: [plan, matrix]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # `plan` can fail before it emits options; the merge still runs so a
      # partial experiment is visible, and the comparison needs a fallback.
      COMPARE: ${{ needs.plan.outputs.options && fromJSON(needs.plan.outputs.options).compare || 'oberth,native' }}
    steps:
      - name: Check out the engine
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          path: source
      - name: Download every shard
        # A missing shard is a coverage fact the merge reports; it must not stop
        # the merge from publishing the shards that did finish.
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: agent-eval-shard-*
          path: shards
          merge-multiple: false
      - name: Merge the shards into one matrix
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t reports < <(find "$GITHUB_WORKSPACE/shards" -name report.json -print | sort)
          if [ "${#reports[@]}" -eq 0 ]; then
            echo "No shard produced report.json." >&2
            exit 1
          fi
          # --merge is an append flag: every report needs its own flag. Passing
          # `--merge r1 r2` makes argparse reject the extra paths.
          args=()
          for report in "${reports[@]}"; do
            args+=(--merge "$report")
          done
          args+=(
            --out "$GITHUB_WORKSPACE/agent-eval-merged"
            --expect-scenarios "${{ needs.plan.outputs.expected_scenarios }}"
            --require-coverage
            --require-comparable
            --compare "$COMPARE"
          )
          python3 scripts/agent_eval.py "${args[@]}"
      - name: Publish the merged matrix to the job summary
        if: always()
        shell: bash
        run: |
          report="$GITHUB_WORKSPACE/agent-eval-merged/report.md"
          if [ -f "$report" ]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No merged report.md was written." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Keep the merged report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: agent-eval-merged-${{ github.run_id }}
          path: agent-eval-merged/
          if-no-files-found: warn
          retention-days: 30
