name: Product website / Cloudflare

# The public site (oberth.zayju.de) is deployed only after the Product website
# workflow has built and verified the same commit in a real browser. GitHub
# Pages stays as the preview; both read the same site/dist build.
on:
  workflow_run:
    workflows: ["Product website"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v4
        with:
          node-version: '22'
      - name: Build for the public domain
        env:
          SITE_URL: https://oberth.zayju.de/
        run: python3 site/build.py
      - name: Deploy the verified build to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4.157.0 pages deploy site/dist
          --project-name option-berth --branch main --commit-dirty=true
