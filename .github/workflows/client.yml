name: Client and brand verification
on:
  pull_request:
    # Validate stacked UI PRs as well as changes targeting main.
    paths: ['client/macos/**', 'brand/**', '.github/workflows/client.yml']
  push:
    branches: [main]
    paths: ['client/macos/**', 'brand/**', '.github/workflows/client.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: macOS client and shared brand geometry
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Check generated assets
        run: |
          python3 brand/build-option-berth.py --check
          python3 -m unittest discover -s brand -p 'test_*.py'
      - name: Test isolated daemon executable resolution
        run: |
          swiftc client/macos/Sources/DaemonLaunch.swift client/macos/Tests/DaemonLaunchTests.swift -o "$RUNNER_TEMP/daemon-launch-tests"
          "$RUNNER_TEMP/daemon-launch-tests"
      - name: Verify bounded CLI stdout and stderr
        run: |
          swiftc client/macos/Sources/CLI.swift client/macos/Sources/DaemonLaunch.swift client/macos/Tests/CLIIOTests.swift -o "$RUNNER_TEMP/cli-io-tests"
          "$RUNNER_TEMP/cli-io-tests"
      - name: Verify Git cancellation and draft result ownership
        run: |
          swiftc client/macos/Sources/CLI.swift client/macos/Sources/DaemonLaunch.swift client/macos/Sources/GitStore.swift client/macos/Sources/GitReadQueue.swift client/macos/Sources/GitModel.swift client/macos/Tests/GitCancellationTests.swift -o "$RUNNER_TEMP/git-cancellation-tests"
          "$RUNNER_TEMP/git-cancellation-tests"
          swiftc client/macos/Sources/DraftRunState.swift client/macos/Tests/DraftRunStateTests.swift -o "$RUNNER_TEMP/draft-state-tests"
          "$RUNNER_TEMP/draft-state-tests"
      - name: Verify native draft buttons and window cancellation
        run: |
          swiftc client/macos/Sources/{AddProjectSheet,DraftRunState,CLI,DaemonLaunch,Brand,UISettings,BerthGeometry}.swift client/macos/Tests/DraftSheetInteractionTests.swift -o "$RUNNER_TEMP/draft-native-tests"
          isolation=$(mktemp -d "$RUNNER_TEMP/draft-native.XXXXXX")
          trap 'rm -rf "$isolation"' EXIT
          mkdir -p "$isolation/home" "$isolation/berth"
          HOME="$isolation/home" CFFIXED_USER_HOME="$isolation/home" BERTH_HOME="$isolation/berth" "$RUNNER_TEMP/draft-native-tests"
      - name: Verify explicit agent continuation identity
        run: |
          swiftc client/macos/AgentSupport/AgentBridge.swift client/macos/Tests/AgentResumeTests.swift -o "$RUNNER_TEMP/agent-resume-tests"
          "$RUNNER_TEMP/agent-resume-tests"
      - name: Verify real isolated PTY sessions
        run: swift run --package-path client/macos --force-resolved-versions TerminalChecks
      - name: Verify isolated agent planner, composer and native handoff
        run: swift run --package-path client/macos --force-resolved-versions AgentChecks
      - name: Build native application and icon
        run: |
          client/macos/build.sh
          test -s client/macos/build/OptionBerth.app/Contents/Resources/AppIcon.icns
          test -s client/macos/build/OptionBerth.app/Contents/Resources/Fonts/LICENSE-Monaspace.txt
      - name: Verify bounded Git read scheduling
        run: |
          swiftc client/macos/Sources/GitReadQueue.swift client/macos/Tests/GitReadQueueTests.swift -o "$RUNNER_TEMP/git-read-queue-tests"
          "$RUNNER_TEMP/git-read-queue-tests"
