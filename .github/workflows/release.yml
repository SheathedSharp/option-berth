name: Verified release
on:
  # Packaging and verification run only for annotated release tags.
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          # SHA-only checkout keeps fetched annotated tag objects intact.
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Validate release policy with disposable repositories
        run: python3 -m unittest discover -s scripts -p '*release*_test.py'
      - name: Validate immutable version input
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/release.py --validate-tag "$TAG"
  verify:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: policy
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          # SHA-only checkout keeps fetched annotated tag objects intact.
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - name: Install package tools for tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm msitools
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.46.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Native release gates
        env:
          GOTOOLCHAIN: local
        run: python3 scripts/release.py --verify-only
  windows:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: policy
    uses: ./.github/workflows/windows.yml
  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, windows]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: linux, arch: amd64, runner: ubuntu-24.04}
          - {os: linux, arch: arm64, runner: ubuntu-24.04}
          - {os: windows, arch: amd64, runner: ubuntu-24.04}
          - {os: windows, arch: arm64, runner: ubuntu-24.04}
          - {os: darwin, arch: amd64, runner: macos-15}
          - {os: darwin, arch: arm64, runner: macos-15}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          # SHA-only checkout keeps fetched annotated tag objects intact.
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - name: Build archives with per-target notices
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          set -- --os "$TARGET_OS" --arch "$TARGET_ARCH" --output dist
          python3 scripts/package_release.py "$@"
      - name: Build Linux packages
        if: matrix.os == 'linux'
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.46.0
          export PATH="$(go env GOPATH)/bin:$PATH"
          python3 scripts/package_linux.py --arch "$TARGET_ARCH" --dist dist
      - name: Build Windows MSI
        if: matrix.os == 'windows' && matrix.arch == 'amd64'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y msitools
          python3 scripts/package_windows_msi.py --dist dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
  msi-smoke:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-windows-amd64
          path: dist
      - name: Install, run and uninstall the MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $msi = Join-Path $PWD "dist\option-berth-$version-windows-amd64.msi"
          if (-not (Test-Path -LiteralPath $msi -PathType Leaf)) { throw "missing MSI: $msi" }
          $install = Start-Process msiexec.exe -ArgumentList @('/i', "`"$msi`"", '/qn', '/norestart', '/l*v', 'msi-install.log') -Wait -PassThru
          if ($install.ExitCode -notin 0, 3010) { Get-Content msi-install.log -Tail 80; throw "install failed: $($install.ExitCode)" }
          $bin = Join-Path $env:LOCALAPPDATA 'option-berth\bin'
          $exe = Join-Path $bin 'oberth.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'oberth.exe was not installed' }
          & $exe version
          if ($LASTEXITCODE -ne 0) { throw 'installed oberth did not run' }
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (($userPath -split ';') -notcontains $bin) { throw 'MSI did not add bin to the user PATH' }
          $uninstall = Start-Process msiexec.exe -ArgumentList @('/x', "`"$msi`"", '/qn', '/norestart', '/l*v', 'msi-uninstall.log') -Wait -PassThru
          if ($uninstall.ExitCode -notin 0, 3010) { Get-Content msi-uninstall.log -Tail 80; throw "uninstall failed: $($uninstall.ExitCode)" }
          if (Test-Path -LiteralPath $exe) { throw 'oberth.exe remains after uninstall' }
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (($userPath -split ';') -contains $bin) { throw 'MSI left bin on the user PATH' }
      - name: Keep MSI logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: msi-smoke-${{ github.run_id }}
          path: msi-*.log
          retention-days: 7
          if-no-files-found: ignore
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, msi-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          # SHA-only checkout keeps fetched annotated tag objects intact.
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Publish only after uploaded assets verify on download
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: python3 scripts/publish_release.py --tag "$TAG" --assets dist
