name: Git review projection
on:
  pull_request:
    paths: ['client/macos/Sources/GitModel.swift', 'client/macos/Sources/CodeView.swift', 'client/macos/Tests/GitReviewTests.swift', 'client/macos/GitReviewTests/**', 'client/macos/Package.swift', '.github/workflows/git-review.yml']
  push:
    branches: [main]
    paths: ['client/macos/Sources/GitModel.swift', 'client/macos/Tests/GitReviewTests.swift', 'client/macos/GitReviewTests/**', 'client/macos/Package.swift', '.github/workflows/git-review.yml']
permissions:
  contents: read
jobs:
  projection:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Verify strict facts, all conflict states, filtered paths and honest totals
        run: |
          swiftc -swift-version 5 client/macos/Sources/GitModel.swift client/macos/Tests/GitReviewTests.swift -o "$RUNNER_TEMP/git-review-tests"
          "$RUNNER_TEMP/git-review-tests"
      - name: Verify real search focus, selection and responsive native splits
        run: |
          set -euo pipefail
          swift build --package-path client/macos --force-resolved-versions --product GitReviewChecks
          binary_dir=$(swift build --package-path client/macos --show-bin-path)
          isolation=$(mktemp -d "$RUNNER_TEMP/git-review.XXXXXX")
          trap 'rm -rf "$isolation"' EXIT
          mkdir -p "$isolation/home" "$isolation/berth" "$RUNNER_TEMP/git-review-evidence"
          HOME="$isolation/home" CFFIXED_USER_HOME="$isolation/home" BERTH_HOME="$isolation/berth" "$binary_dir/GitReviewChecks"
          cp "$isolation/berth/"*-native.png "$RUNNER_TEMP/git-review-evidence/"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: git-review-${{ github.run_id }}
          path: ${{ runner.temp }}/git-review-evidence/*.png
          retention-days: 7
          if-no-files-found: error
