name: Product website
on:
  # Called by ci.yml for a pull request that touches the site or its toolchain,
  # so website changes are gated by the required check like any other area. A
  # caller only verifies: deploying from a call would run the Pages job on the
  # caller's read-only token. A push to main deploys directly so a deployment
  # never waits for a pull request, and a manual dispatch of this workflow
  # deploys unless the dispatcher says otherwise.
  workflow_call:
    inputs:
      deploy:
        description: Deploy the verified site to GitHub Pages.
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the verified site to GitHub Pages.
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'
      - '.github/actions/setup-site/**'
permissions:
  contents: read
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-site
      - name: Build verified static pages
        run: python3 site/build.py
      - name: Verify browsers, responsive layouts, keyboard and reduced motion
        working-directory: site
        run: npm test
      - name: Keep browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: website-browser-evidence-${{ github.run_id }}
          path: site/test-results/
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy)
        with:
          path: site/dist
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy)
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Deploy reviewed static website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
