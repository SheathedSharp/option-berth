name: CI configuration

on:
  # Called by ci.yml for pull requests. The push trigger stays because this
  # check also compares the live ruleset after a settings change that never
  # went through a pull request.
  workflow_call:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/quality-gate-checks.json'
      - 'scripts/check_ci_gate.py'
      - 'scripts/check_ci_gate_test.py'
      - 'scripts/changed_areas.py'
      - 'scripts/changed_areas_test.py'
      - 'scripts/ci_failures.py'
      - 'scripts/ci_failures_test.py'
      - 'scripts/flaky-tests.txt'
      - 'scripts/race-packages.txt'
      - 'scripts/release.py'
      - 'scripts/retry-ci.sh'
      - 'scripts/retry_ci_test.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: lint and gate consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - name: Install actionlint
        shell: bash
        run: |
          # Only the network fetch is retried; the lint step below runs once, so
          # a real workflow error still fails this check on the first attempt.
          source scripts/retry.sh
          retry 4 5 -- go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Lint every workflow
        run: actionlint .github/workflows/*.yml
      - name: Check required checks against workflow jobs
        run: python3 scripts/check_ci_gate.py
      - name: Run gate checker tests
        run: python3 -m unittest discover -s scripts -p 'check_ci_gate_test.py'
