name: Reused service readiness
on:
  # Called by ci.yml, which owns the pull request trigger and the path
  # routing. A manual dispatch still runs this check on its own.
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - name: Check real healthy and unhealthy service reuse
        shell: bash
        run: |
          set -euo pipefail
          output=$(mktemp -d)
          trap 'rm -rf "$output"' EXIT
          (cd engine && go build -o "$output/oberth" ./cmd/oberth)
          python3 scripts/verify-reused-readiness.py --binary "$output/oberth"
