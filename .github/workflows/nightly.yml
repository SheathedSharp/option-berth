name: Nightly full verification

on:
  # The PR gate is intentionally fast. This scheduled run executes the same
  # full gate as a release on the current default branch, so race, real
  # service scenario and environment-specific failures surface before a tag
  # is pushed instead of after a version is published.
  schedule:
    - cron: '23 18 * * *' # 02:23 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full:
    name: Nightly / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    env:
      GOMAXPROCS: '4'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Record the exact verification input
        shell: bash
        run: |
          mkdir -p verification
          git rev-parse HEAD > verification/commit.txt
          git rev-parse HEAD^{tree} > verification/tree.txt
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - name: Install package tools for tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.46.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Full release-equivalent gate
        env:
          GOTOOLCHAIN: local
        shell: bash
        run: |
          set -o pipefail
          go version | tee verification/go-version.txt
          python3 scripts/release.py --verify-only 2>&1 | tee verification/full.log
      - name: Check required checks against the ruleset
        if: runner.os == 'Linux' && (success() || failure())
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_ci_gate.py --check-ruleset
      - name: Retain verification logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-verification-${{ matrix.os }}-${{ github.run_id }}
          path: verification/
          retention-days: 14
