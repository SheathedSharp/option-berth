name: Nightly full verification

on:
  # The PR gate is intentionally fast. This scheduled run executes the same
  # full gate as a release on the current default branch, so race, real
  # service scenario and environment-specific failures surface before a tag
  # is pushed instead of after a version is published. It also reads the live
  # ruleset, which covers a settings change that never went through a pull
  # request.
  schedule:
    - cron: '23 18 * * *' # 02:23 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full:
    name: Nightly / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    env:
      GOMAXPROCS: '4'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-engine
        with:
          install-packaging-tools: ${{ runner.os == 'Linux' }}
          record-verification: 'true'
      - name: Full release-equivalent gate
        env:
          GOTOOLCHAIN: local
        shell: bash
        run: |
          set -o pipefail
          go version | tee verification/go-version.txt
          python3 scripts/release.py --verify-only 2>&1 | tee verification/full.log
      - name: Check required checks against the ruleset
        if: runner.os == 'Linux' && (success() || failure())
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_ci_gate.py --check-ruleset
      - name: Retain verification logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nightly-verification-${{ matrix.os }}-${{ github.run_id }}
          path: verification/
          retention-days: 14

  observation-selfcheck:
    # A scheduled self-check, not a gate: each supported runner binds a local
    # port and asks the same collector a status read uses whether it can see
    # that socket as this process. Issue #156 is the failure this exists to
    # catch — a sandbox or OS change lets the collector exit 0 with a table it
    # never read, and an empty port list silently becomes "nothing is
    # listening". Nothing here is a required check; a red run is a fact to
    # read, not a merge block.
    name: Nightly / observation selfcheck (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-engine
      - name: Build the engine
        working-directory: engine
        shell: bash
        run: |
          set -euo pipefail
          go build -o bin/oberth ./cmd/oberth
      - name: Prove this runner can see its own listener
        working-directory: engine
        shell: bash
        env:
          # A throwaway home keeps this run off any real installation and gives
          # the config, socket and database paths somewhere harmless to point at.
          BERTH_HOME: ${{ runner.temp }}/berth-home
        run: |
          set -euo pipefail
          # Exit 0 means the probe bound 127.0.0.1 and the collector showed it as
          # this process. Exit 1 means the process could bind but the collector
          # could not see the socket, and the failing row names the collector
          # with both collectors' reasons; that is the red this schedule exists
          # to produce, so the command's own exit code is the assertion.
          ./bin/oberth doctor --only listener_observation
