name: 缺陷报告
description: 报告 oberth 引擎或 CLI 的错误行为、误停、归属错误或账本损坏
title: "[bug] "
body:
  - type: markdown
    attributes:
      value: |
        这个仓库只处理引擎与 `oberth` CLI。macOS 客户端和 coding agent 的 skill 是独立产品，
        请用下方链接到各自仓库提交。

        提交前请删去凭证、私人路径、真实用户数据和未经脱敏的日志。
  - type: textarea
    id: happened
    attributes:
      label: 发生了什么
      description: 实际行为是什么，你期望的行为是什么。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 给出最小可复现的命令、清单片段和初始状态。
      placeholder: |
        1. oberth version
        2. oberth status --json
        3. oberth up --json
        4. 观察到 ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: oberth 版本
      description: 运行 `oberth version` 的结果。
      placeholder: "1.3.0"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: 平台
      description: 操作系统与架构。
      placeholder: "macOS 15 / arm64；Ubuntu 24.04 / amd64"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      description: 最接近的一项；不确定时选“不确定”。
      options:
        - 启动 / 停止 / 就绪判定
        - 监听观察 / 端口归属
        - 清单解析 / 引用
        - 运行记录 / 账本 / attention
        - 安装 / 升级
        - 不确定
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 运行事实
      description: 相关命令的 `--json` 输出或 `oberth logs <service> --once` 片段。只贴证明问题所需的部分。
      render: text
  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 issue，没有重复报告。
          required: true
        - label: 我已删除凭证、私人路径和真实用户数据。
          required: true
