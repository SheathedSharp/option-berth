<div class="doc-shell">
  <aside class="doc-rail" id="doc-rail" data-rail>
    <nav class="doc-rail-nav" aria-label="$toc_title">
$rail
    </nav>
  </aside>
  <main class="doc-body" id="main">
    <article class="doc-article">
      <nav class="doc-crumbs" aria-label="$breadcrumb">
        <ol>
          <li><a href="$guide_home">$nav_guide</a></li>
          <li><span>$part_title</span></li>
        </ol>
      </nav>
      <h1>$title</h1>
      <div class="doc-prose" data-chapter-body>
$body
      </div>
      <nav class="doc-pager" aria-label="$chapter_nav">
$prev_link
$next_link
      </nav>
      <p class="doc-edit"><a href="$edit_url">$edit_page<span aria-hidden="true"> ↗</span></a></p>
    </article>
    <aside class="doc-aside">
      <details class="doc-toc" data-toc open>
        <summary>$on_this_page</summary>
        <nav aria-label="$on_this_page">
          <ol>
$page_toc
          </ol>
        </nav>
      </details>
      <nav class="doc-aside-refs" aria-label="$contract_title">
        <h2>$contract_title</h2>
        <ul>
$refs
        </ul>
      </nav>
      <div class="doc-aside-machine">
        <h2>$foot_machine</h2>
        <p>$machine_note</p>
        <ul>
          <li><a href="${root_prefix}llms.txt">llms.txt</a></li>
          <li><a href="${root_prefix}llms-full.txt">llms-full.txt</a></li>
        </ul>
      </div>
    </aside>
  </main>
</div>
