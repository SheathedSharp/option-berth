<div class="book-shell wrap">
  <aside class="book-rail">
    <nav class="rail-chain" aria-label="$chain_title">
      <p class="rail-chain-title">$chain_title</p>
      <ol class="rail-stations">
$station_links
      </ol>
    </nav>
    <details class="rail-toc" open>
      <summary>$toc_title</summary>
$toc
    </details>
  </aside>
  <article class="book-article">
    <header class="chapter-head">
      <h1>$title</h1>
      <p class="chapter-lede">$lede</p>
    </header>
    <div class="chapter-body" data-chapter-body>
$body
    </div>
    <nav class="chapter-nav" aria-label="$chapter_nav">
$prev_link
$next_link
    </nav>
  </article>
  <aside class="book-aside">
    <nav class="page-toc" aria-label="$on_this_page">
      <h2>$on_this_page</h2>
      <ol>
$page_toc
      </ol>
    </nav>
    <nav class="contract-links" aria-label="$contract_title">
      <h2>$contract_title</h2>
      <ul>
$refs
      </ul>
    </nav>
    <nav class="machine-links" aria-label="$foot_machine">
      <h2>$foot_machine</h2>
      <p>$machine_note</p>
      <ul>
        <li><a href="${root_prefix}llms.txt">llms.txt</a></li>
        <li><a href="${root_prefix}llms-full.txt">llms-full.txt</a></li>
      </ul>
    </nav>
  </aside>
</div>
