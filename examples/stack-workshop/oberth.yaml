# A ten-service Python stack plus one real Postgres container, a slow
# dependency, a prepared frontend, a migrated database, portless workers and a
# read-only machine dependency. Every command is explicit: nothing here is
# inferred from a running process. The stack needs Docker for the `db` service.
name: stack-workshop
services:
  - name: auth
    cmd: python3 -u service.py
    port: auto
    health: /health
    env:
      SERVICE_NAME: auth
      READY_DELAY: "4"
      VERSION_FILE: variant.txt

  - name: catalog
    cmd: python3 -u service.py
    port: auto
    health: /health
    env:
      SERVICE_NAME: catalog
      VERSION_FILE: variant.txt

  # A real Postgres container. `docker compose up` stays in the foreground so a
  # normal `oberth down` sends SIGTERM to Compose and Compose stops its own
  # containers; `down --force` sends SIGKILL and would leave them running.
  # `-p app_${worktree}` gives every checkout its own project, network and
  # volume, and `port: auto` is handed to Compose as PORT.
  - name: db
    cmd: docker compose -f docker-compose.yml -p app_${worktree} up
    port: auto
    health:
      command: docker compose -f docker-compose.yml -p app_${worktree} exec -T db pg_isready -U app -d app_${worktree}
    env:
      DB_NAME: app_${worktree}

  - name: api
    prepare: python3 migrate.py
    prepare_inputs: [schema.sql]
    cmd: python3 -u service.py
    port: auto
    health: /health
    depends_on: [auth, catalog, db]
    env:
      SERVICE_NAME: api
      DB_PATH: .berth/${worktree}/app.db
      TCP_REQUIRE: ${db.url}
      VERSION_FILE: variant.txt
      REQUIRE: ${auth.url}/health,${catalog.url}/health

  - name: gateway
    cmd: python3 -u service.py
    port: auto
    health: /health
    depends_on: [api]
    env:
      SERVICE_NAME: gateway
      VERSION_FILE: variant.txt
      REQUIRE: ${api.url}/health

  - name: web
    prepare: python3 build.py
    prepare_inputs: [src/app.html, variant.txt]
    cmd: python3 -u service.py
    port: auto
    health: /health
    env:
      SERVICE_NAME: web
      DIST: dist
      VERSION_FILE: dist/version.txt

  - name: search
    cmd: python3 -u service.py
    port: auto
    health: /health
    depends_on: [catalog]
    env:
      SERVICE_NAME: search
      VERSION_FILE: variant.txt
      REQUIRE: ${catalog.url}/health

  - name: billing
    cmd: python3 -u service.py
    port: auto
    health: /health
    env:
      SERVICE_NAME: billing
      VERSION_FILE: variant.txt

  - name: ingest
    cmd: python3 -u service.py
    port: auto
    health: /health
    depends_on: [catalog]
    env:
      SERVICE_NAME: ingest
      VERSION_FILE: variant.txt

  - name: worker
    cmd: python3 -u worker.py
    depends_on: [api]
    env:
      SERVICE_NAME: worker
      API_URL: ${api.url}
      HEARTBEAT: .berth/${worktree}/worker.heartbeat

  - name: notifier
    cmd: python3 -u worker.py
    depends_on: [api]
    env:
      SERVICE_NAME: notifier
      API_URL: ${api.url}
      HEARTBEAT: .berth/${worktree}/notifier.heartbeat

# Read-only reference. The stack reads it if it exists; `up` and `down` never
# start or stop it. Postgres is no longer a machine reference: it is the `db`
# service above, owned and started per worktree.
machine:
  - name: redis
    port: 6379
